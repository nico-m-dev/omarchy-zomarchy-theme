# Zomarchy — a heavier bar to carry the comic-book lettering.

[bar]
background       = "#121212"
background-alpha = 1.0
text             = "#d8d2c8"
# Modules calling attention to themselves (recording, voxtype, alerts, updates)
active           = "#b86f63"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32
