# Zomarchy — chunky controls: 2px borders and more visible states, so buttons and
# fields read like drawn panels instead of thin terminal chrome.

[controls]
normal-color        = "#d8d2c8"
normal-fill-alpha   = 0.05
normal-border       = "#d8d2c8"
normal-border-width = 2
normal-border-alpha = 0.55

hover-cursor-color        = "#d8d2c8"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#d8d2c8"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 0.45

focus-color        = "#d8d2c8"
focus-fill-alpha   = 0.12
focus-border       = "#d8d2c8"
focus-border-width = 2
focus-border-alpha = 0.70

selected-color        = "#d8d2c8"
selected-fill-alpha   = 0.20
selected-border       = "#d8d2c8"
selected-border-width = 1
selected-border-alpha = 0.80

pressed-fill-alpha   = 0.24
selection-fill-alpha = 0.38
